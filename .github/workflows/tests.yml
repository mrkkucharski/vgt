name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The test contract is intentionally independent of the runner's
      # locale, clock zone, hash randomization, and globally installed pytest
      # plugins.  Lua tests invoke this exact interpreter, not whichever
      # `lua` alternative happens to be first on PATH.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      TZ: UTC
      VGT_TEST_LUA: /usr/bin/lua5.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install Lua for ReaScript fixture tests
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - run: uv sync --frozen
      - run: uv run pytest -q tests
