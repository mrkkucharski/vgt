[project]
name = "vgt"
version = "0.1.0"
description = "Non-destructive REAPER project plumbing for virtual guitar teacher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.22,<2",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
vgt = "vgt.cli:main"

[project.optional-dependencies]
# madmom is the primary beat/downbeat backend (docs/GOAL.md), but its last
# release predates modern Python/NumPy and its build is fragile -- isolated
# here so a default `vgt` install never needs Cython or a legacy NumPy ABI.
# When unavailable (or it fails to import), the tempo stage falls back to
# librosa's beat_track (no downbeats).
madmom = [
    "madmom>=0.16.1",
    "setuptools<81",  # madmom still imports the deprecated pkg_resources API
]
# MSAF is the primary section-segmentation backend (docs/GOAL.md), but its
# maintenance is uncertain and its last release predates modern
# Python/NumPy/SciPy -- isolated here so a default `vgt` install never needs
# it. When unavailable (or it fails to import/process), the sections stage
# falls back to a self-similarity novelty + peak-picking heuristic built on
# librosa (a hard dependency above).
msaf = ["msaf>=0.1.80"]

[tool.uv.extra-build-dependencies]
madmom = ["Cython", "numpy<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/vgt"]
